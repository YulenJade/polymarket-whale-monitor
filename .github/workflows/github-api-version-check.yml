name: GitHub API version checker tests

on:
  pull_request:
    paths:
      - "github_version_check.py"
      - "tests/test_github_version_check.py"
      - ".github/workflows/github-api-version-check.yml"
  push:
    branches:
      - "feature/github-api-release-check"
    paths:
      - "github_version_check.py"
      - "tests/test_github_version_check.py"
      - ".github/workflows/github-api-version-check.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test GitHub API checker
        run: python -m unittest discover -s tests -p 'test_github_version_check.py' -v
